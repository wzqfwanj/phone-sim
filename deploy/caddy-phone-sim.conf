# =============================================================================
# phone-sim：把 https://wkeeli.cn/phone/ 反向代理到应用机 180.76.180.249:8140
# 适用：网关机 aliyun（8.133.209.25）的 Caddy 2.x，
#       配置文件 /etc/caddy/Caddyfile 中已有的 `wkeeli.cn { ... }` 站点块。
# =============================================================================
#
# 一、插入位置
#   把下面「复制以下块」之后的内容原样粘贴进 `wkeeli.cn { ... }` 块内。
#   Caddy 的 handle 按书写顺序匹配，因此：
#     - 必须在兜底的 `reverse_proxy localhost:5000` 之前，否则永远不会命中；
#     - 实际建议紧跟已有的 `/resume` handle 块之后。
#
# 二、为什么用 handle_path 而不是 handle
#   本应用按「子路径部署」编写：前端所有资源与 API 一律使用相对路径
#   （如 app.js、api/health，不带前导 /）。handle_path /phone/* 会先剥掉 /phone
#   前缀再转发，于是：
#     /phone/            -> /            （index.html）
#     /phone/style.css   -> /style.css
#     /phone/api/health  -> /api/health
#   若用 handle + 手工 strip 前缀，很容易漏写，症状是「页面能打开但样式/脚本 404」。
#
# 三、认证与安全头
#   1) 认证：wkeeli.cn 块顶部已有全站 Basic Auth（basic_auth @not_local），
#      /phone/ 自动被覆盖；服务器本机（源 IP 127.0.0.1）发起的请求免认证。
#      应用内部没有登录页，也不需要登录——不要在这里重复写 basic_auth。
#   2) CSP：站级响应头已是 default-src 'self'；本应用零外链、零 CDN、零网络字体，
#      因此兼容，无需改动安全头。不要在此片段里加 header 指令，避免覆盖站级设置。
#   3) 本片段不包含任何账号或密码明文。
#
# 四、备份 / 插入 / 校验 / 重载（网关机 root 执行）
#   cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%Y%m%d%H%M%S)
#   vi /etc/caddy/Caddyfile                      # 按上面的位置插入片段
#   caddy validate --config /etc/caddy/Caddyfile # 必须先通过
#   systemctl reload caddy
#   systemctl status caddy --no-pager
#
#   回滚：
#   cp -a /etc/caddy/Caddyfile.bak.YYYYMMDDHHMMSS /etc/caddy/Caddyfile
#   systemctl reload caddy
#
# 五、线上验证（网关机本机；--resolve 绕过 DNS 指向本机 Caddy，
#     源 IP 127.0.0.1 免 Basic Auth，用于验证 Caddy 转发链本身）
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/phone/              # 期望 200
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/phone/api/health   # 期望 200
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/phone/style.css    # 期望 200（验证前缀已剥离）
#
#   本地公网访问（Windows）：
#   curl -s -o /dev/null -w '%{http_code}\n' https://wkeeli.cn/phone/   # 期望 401：全站登录门生效，属正常现象
#   浏览器登录（全站账号 wkeeli）后即可正常使用。
#
# ========================== 复制以下块（粘贴进 wkeeli.cn 站点块内） ==========================
	# ---- phone-sim 子路径：/phone/ ----
	# 不带尾斜杠时 308 补齐，保证相对路径解析基准正确
	redir /phone /phone/ 308
	handle_path /phone/* {
		reverse_proxy http://180.76.180.249:8140 {
			# 便于后端/日志识别原始前缀；本应用用相对路径，不依赖该头
			header_up X-Forwarded-Prefix /phone
		}
	}
# ========================== 片段结束 ==========================
